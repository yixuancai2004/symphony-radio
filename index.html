<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="一台只有一个旋钮的小收音机，收听新加坡 Symphony 92.4 古典音乐电台（非官方）。">
  <meta name="theme-color" content="#2b2a22">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="92.4">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <title>92.4 小收音机</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app" id="app" data-power="off" data-stream="off">
    <main class="desk">
      <div class="slot" id="radioSlot">
        <div class="radio" id="radio" data-power="off" data-stream="off">
          <div class="dial" aria-hidden="true">
            <div class="scale">
              <span style="left:0%">88</span>
              <span style="left:20%">92</span>
              <span style="left:40%">96</span>
              <span style="left:60%">100</span>
              <span style="left:80%">104</span>
              <span style="left:100%">108</span>
              <i class="needle"></i>
            </div>
            <b class="band">FM</b>
            <b class="unit">MHz</b>
          </div>
          <div class="lower">
            <div class="grille" aria-hidden="true"></div>
            <div class="switch">
              <span class="mark off">OFF</span>
              <span class="mark on">ON</span>
              <button class="knob" id="power" aria-pressed="false" aria-label="开 / 关"><i></i></button>
            </div>
          </div>
        </div>
      </div>
      <p class="floating-note">收音机在桌面浮窗里。</p>

      <button class="now" id="now" aria-expanded="false" aria-controls="cardWrap" disabled>
        <span class="now-composer" id="composer">Symphony 92.4</span>
        <span class="now-title" id="title">新加坡的古典音乐电台</span>
      </button>
      <p class="status" id="status" hidden></p>

      <!-- a printed card that slides out from under the radio -->
      <div class="card-wrap" id="cardWrap">
        <div class="card-clip">
          <article class="card" id="card" inert></article>
        </div>
      </div>
    </main>
  </div>

  <audio id="audio" preload="none"></audio>
  <script src="app.js"></script>
</body>
</html>
